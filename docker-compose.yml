services:
  backend:
    build:
      context: .
      dockerfile: backend/RecipeApi/Dockerfile
    ports:
      - "5220:5220"
    environment:
      ASPNETCORE_URLS: http://+:5220
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend/recipe-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
